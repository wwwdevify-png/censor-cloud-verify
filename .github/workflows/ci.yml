name: CI
on:
  workflow_dispatch:
  push:
    branches: ["**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify cloud agent README section
        run: |
          grep -q '^## Cloud verification' README.md
          grep -qi 'Censor Cloud agent' README.md
          echo "Cloud verification README section OK"
